name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the EXE name (e.g. 1.3.0)"
        required: true
        type: string
      publish_release:
        description: "Upload to a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Pasty.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.3.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test core
        run: cargo test --manifest-path windows/Cargo.toml -p pasty-core

      - name: Build release EXE
        run: cargo build --release -p pasty --manifest-path windows/Cargo.toml

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp windows/target/release/pasty.exe "dist/Pasty-${{ steps.ver.outputs.version }}-windows-x64.exe"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pasty-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/Pasty-*-windows-x64.exe

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pasty ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/Pasty-${{ steps.ver.outputs.version }}-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

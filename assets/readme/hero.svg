<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Pasty</title>
  <desc id="hero-desc">macOS 菜单栏剪贴板。文字和截图留在这台 Mac 上，用 Command+Shift+V 选中，再用 Command+V 粘贴，焦点留在原来的窗口。</desc>
  <defs>
    <clipPath id="panel-clip">
      <rect x="736" y="40" width="412" height="360" rx="20"/>
    </clipPath>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#F4EFE6"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="64" y="96" fill="#8A8175" font-size="20" font-weight="600">菜单栏剪贴板</text>
    <text x="64" y="188" fill="#1C1814" font-size="84" font-weight="700">Pasty</text>
    <text x="64" y="252" fill="#3F3830" font-size="26">文字和截图留在这台 Mac 上。</text>
    <text x="64" y="292" fill="#3F3830" font-size="26">Cmd+Shift+V 选中，Cmd+V 粘贴，焦点留在原窗口。</text>
    <g font-size="18" font-weight="600">
      <rect x="64" y="340" width="132" height="40" rx="20" fill="#E7E0D4"/>
      <text x="130" y="366" text-anchor="middle" fill="#1C1814">macOS 13+</text>
      <rect x="208" y="340" width="168" height="40" rx="20" fill="#E7E0D4"/>
      <text x="292" y="366" text-anchor="middle" fill="#1C1814">历史只在本机</text>
      <rect x="388" y="340" width="156" height="40" rx="20" fill="#F3DDD4"/>
      <text x="466" y="366" text-anchor="middle" fill="#C4512C">最多 100 条</text>
    </g>
  </g>
  <g id="history-panel" clip-path="url(#panel-clip)" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, sans-serif">
    <rect x="736" y="40" width="412" height="360" fill="#FFFCF7"/>
    <polygon points="1108,40 1148,40 1148,80" fill="#EADCCB"/>
    <polyline points="1108,40 1108,80 1148,80" fill="none" stroke="#D4C4B0" stroke-width="1.5"/>
    <rect x="760" y="66" width="22" height="26" rx="3" fill="none" stroke="#1C1814" stroke-width="1.75"/>
    <path d="M766 66 v-4 h10 v4" fill="none" stroke="#C4512C" stroke-width="1.75" stroke-linecap="round"/>
    <text x="794" y="86" fill="#1C1814" font-size="22" font-weight="700">剪贴板</text>
    <rect x="1040" y="64" width="36" height="26" rx="13" fill="#F3EEE6"/>
    <text x="1058" y="82" text-anchor="middle" fill="#8A8175" font-size="16" font-weight="600">3</text>
    <rect x="760" y="112" width="364" height="40" rx="10" fill="#F3EEE6"/>
    <circle cx="780" cy="132" r="7" fill="none" stroke="#8A8175" stroke-width="1.75"/>
    <path d="M785 137 l5 5" fill="none" stroke="#8A8175" stroke-width="1.75" stroke-linecap="round"/>
    <text x="800" y="139" fill="#8A8175" font-size="20">搜索</text>
    <rect x="760" y="168" width="364" height="52" rx="12" fill="#E4F1E8"/>
    <rect x="768" y="182" width="4" height="24" rx="2" fill="#1F6B4A"/>
    <text x="784" y="200" fill="#1C1814" font-size="20" font-weight="650">会议纪要，下周三前提交</text>
    <text x="1104" y="200" text-anchor="end" fill="#8A8175" font-size="18">刚刚</text>
    <rect x="772" y="236" width="40" height="30" rx="6" fill="#F6E1D4" stroke="#E4C8B4" stroke-width="1"/>
    <path d="M778 258 l8 -10 6 7 5 -4 9 7" fill="none" stroke="#C4512C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="824" y="256" fill="#1C1814" font-size="20">屏幕快照</text>
    <text x="1104" y="256" text-anchor="end" fill="#8A8175" font-size="18">2 分钟前</text>
    <text x="784" y="312" fill="#1C1814" font-size="20">把这段说明贴回邮件</text>
    <text x="1104" y="312" text-anchor="end" fill="#8A8175" font-size="18">昨天</text>
    <line x1="760" y1="344" x2="1124" y2="344" stroke="#E4D9C8" stroke-width="1"/>
    <text x="942" y="376" text-anchor="middle" fill="#8A8175" font-size="18">↑↓ 选择    空格 预览    ↩ 复制</text>
  </g>
  <rect x="736" y="40" width="412" height="360" rx="20" fill="none" stroke="#E4D9C8" stroke-width="1.5"/>
</svg>

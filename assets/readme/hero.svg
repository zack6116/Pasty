<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" aria-labelledby="hero-title hero-desc" role="img" viewBox="0 0 1200 440"><title id="hero-title">Pasty</title><desc id="hero-desc">macOS 菜单栏剪贴板。文字和截图留在这台 Mac 上，用 Command+Shift+V 选中，再用 Command+V 粘贴，焦点留在原来的窗口。</desc><defs><clipPath id="panel-clip"><rect width="412" height="360" x="736" y="40" rx="20"/></clipPath></defs><rect width="1200" height="440" fill="#F4EFE6" rx="28"/><g id="title-block" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, sans-serif"><text x="64" y="96" fill="#8A8175" font-size="20" font-weight="600">菜单栏剪贴板</text><text x="64" y="188" fill="#1C1814" font-size="84" font-weight="700">Pasty</text><text x="64" y="252" fill="#3F3830" font-size="26">文字和截图留在这台 Mac 上。</text><text x="64" y="292" fill="#3F3830" font-size="26">Cmd+Shift+V 选中，Cmd+V 粘贴，焦点留在原窗口。</text><g font-size="18" font-weight="600"><rect width="132" height="40" x="64" y="340" fill="#E7E0D4" rx="20"/><text x="130" y="366" fill="#1C1814" text-anchor="middle">macOS 13+</text><rect width="168" height="40" x="208" y="340" fill="#E7E0D4" rx="20"/><text x="292" y="366" fill="#1C1814" text-anchor="middle">历史只在本机</text><rect width="156" height="40" x="388" y="340" fill="#F3DDD4" rx="20"/><text x="466" y="366" fill="#C4512C" text-anchor="middle">最多 100 条</text></g></g><g id="history-panel" clip-path="url(#panel-clip)" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, sans-serif"><rect width="412" height="360" x="736" y="40" fill="#FFFCF7"/><polygon fill="#EADCCB" points="1108 40 1148 40 1148 80"/><polyline fill="none" stroke="#D4C4B0" stroke-width="1.5" points="1108 40 1108 80 1148 80"/><rect width="22" height="26" x="760" y="66" fill="none" stroke="#1C1814" stroke-width="1.75" rx="3"/><path fill="none" stroke="#C4512C" stroke-linecap="round" stroke-width="1.75" d="M766 66 v-4 h10 v4"/><text x="794" y="86" fill="#1C1814" font-size="22" font-weight="700">剪贴板</text><rect width="36" height="26" x="1040" y="64" fill="#F3EEE6" rx="13"/><text x="1058" y="82" fill="#8A8175" font-size="16" font-weight="600" text-anchor="middle">3</text><rect width="364" height="40" x="760" y="112" fill="#F3EEE6" rx="10"/><circle cx="780" cy="132" r="7" fill="none" stroke="#8A8175" stroke-width="1.75"/><path fill="none" stroke="#8A8175" stroke-linecap="round" stroke-width="1.75" d="M785 137 l5 5"/><text x="800" y="139" fill="#8A8175" font-size="20">搜索</text><rect width="364" height="52" x="760" y="168" fill="#E4F1E8" rx="12"/><rect width="4" height="24" x="768" y="182" fill="#1F6B4A" rx="2"/><text x="784" y="200" fill="#1C1814" font-size="20" font-weight="650">会议纪要，下周三前提交</text><text x="1104" y="200" fill="#8A8175" font-size="18" text-anchor="end">刚刚</text><rect width="40" height="30" x="772" y="236" fill="#F6E1D4" stroke="#E4C8B4" stroke-width="1" rx="6"/><path fill="none" stroke="#C4512C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M778 258 l8 -10 6 7 5 -4 9 7"/><text x="824" y="256" fill="#1C1814" font-size="20">屏幕快照</text><text x="1104" y="256" fill="#8A8175" font-size="18" text-anchor="end">2 分钟前</text><text x="784" y="312" fill="#1C1814" font-size="20">把这段说明贴回邮件</text><text x="1104" y="312" fill="#8A8175" font-size="18" text-anchor="end">昨天</text><line x1="760" x2="1124" y1="344" y2="344" stroke="#E4D9C8" stroke-width="1"/><text x="942" y="376" fill="#8A8175" font-size="18" text-anchor="middle">↑↓ 选择 空格 预览 ↩ 复制</text></g><rect width="412" height="360" x="736" y="40" fill="none" stroke="#E4D9C8" stroke-width="1.5" rx="20"/></svg>